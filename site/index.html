<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chongqingga</title>
  <meta name="description" content="Vote where we go in Chongqing and Chengdu.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="img/panda.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="base.css?v=26">
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-copy">
      <p class="sp-kicker">重庆 <i></i> 成都</p>
      <h2 class="sp-word" aria-label="Chongqingga"></h2>
      <p class="sp-meta"><span>28 Dec – 6 Jan</span><span class="sp-count" id="spCount"></span></p>
    </div>
    <img class="sp-panda" src="img/panda.webp" alt="" width="1200" height="1200" decoding="async">
    <div class="sp-bar"><i id="spBar"></i></div>
  </div>
  <script>
    // Splash: letters for the wordmark, and how long until everyone is in Chongqing (China time).
    (function () {
      var w = document.querySelector(".sp-word"), t = "Chongqingga";
      for (var i = 0; i < t.length; i++) { var s = document.createElement("span"); s.textContent = t[i]; s.style.setProperty("--i", i); w.appendChild(s); }
      var now = location.search.match(/now=([\d\-T:]+)/), ms = now ? Date.parse(now[1] + (now[1].length <= 16 ? ":00+08:00" : "+08:00")) : Date.now();
      var start = Date.parse("2026-12-28T00:00:00+08:00"), end = Date.parse("2027-01-07T00:00:00+08:00");
      var d = Math.ceil((start - ms) / 864e5), c = document.getElementById("spCount");
      c.textContent = ms < start ? (d === 1 ? "Tomorrow" : d + " days to go") : ms < end ? "Day " + (Math.floor((ms - start) / 864e5) + 1) + " of 10" : "Hope it was spicy";
      try { if (sessionStorage.getItem("cq-splash")) document.documentElement.classList.add("sp-quick"); sessionStorage.setItem("cq-splash", "1"); } catch (e) {}
    })();
  </script>

  <header class="bar" id="bar">
    <span class="bar-title" id="barTitle">Chongqingga</span>
    <button class="me pressable" id="meBtn" hidden></button>
  </header>

  <main id="app">
    <section class="hero">
      <h1 id="tripName">Chongqingga</h1>
      <p class="dates" id="tripDates"></p>
    </section>

    <section class="page" id="pagePlan" data-page="plan" aria-label="Plan"></section>

    <section class="page" id="pageItinerary" data-page="itinerary" aria-label="Itinerary" hidden></section>

    <section class="page" id="pageMap" data-page="map" aria-label="Map" hidden></section>

    <section class="page" id="pageInfo" data-page="info" aria-label="Travel info" hidden></section>

    <section class="page" id="pageVote" data-page="vote" aria-label="Vote" hidden>
      <nav class="seg" id="seg" role="tablist" aria-label="Polls"><span class="seg-pill" id="segPill"></span></nav>
      <section class="poll" id="poll" role="tabpanel"></section>
      <p class="foot">Prices are per person, in yuan, from Trip.com and official sites. "est" means a rough guess.<br><button class="link" id="creditsBtn">Photo credits</button></p>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Pages">
    <div class="side-brand" aria-hidden="true"><img src="icon-192.png" alt="" width="40" height="40"><span>Chongqingga<small>重庆 · 成都</small></span></div>
    <button class="tab" data-page="plan" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg>
      <span>Plan</span>
    </button>
    <button class="tab" data-page="itinerary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8.2 6H15a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h6.8"/></svg>
      <span>Itinerary</span>
    </button>
    <button class="tab" data-page="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 3.5 6.6v12.9L9 17.4l6 2.1 5.5-2.1V4.5L15 6.6z"/><path d="M9 4.5v12.9M15 6.6v12.9"/></svg>
      <span>Map</span>
    </button>
    <button class="tab" data-page="vote">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></svg>
      <span>Vote</span><i class="tab-dot" id="voteDot" hidden></i>
    </button>
    <button class="tab" data-page="info">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3"/><circle cx="8.5" cy="11" r="2"/><path d="M5.8 15.6c.5-1.4 1.6-2.1 2.7-2.1s2.2.7 2.7 2.1M14 10h4M14 13.5h3"/></svg>
      <span>Info</span>
    </button>
  </nav>

  <button class="tray material pressable" id="tray" hidden>
    <span class="tray-left">
      <span class="tray-label">Your picks</span>
      <span class="tray-count" id="trayCount">0 places</span>
    </span>
    <span class="tray-right">
      <span class="tray-total" id="trayCny">Free</span>
      <span class="tray-rm" id="trayRm">RM0</span>
    </span>
  </button>

  <div class="offline" id="offline" hidden>Reconnecting…</div>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="app.js?v=26"></script>
</body>
</html>
