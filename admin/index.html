<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chongqingga Admin</title>
  <link rel="icon" href="/site/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <aside class="side">
    <div class="brand">
      <img src="/site/icon.svg" alt="" width="34" height="34">
      <div><b id="brandName">Chongqingga</b><span>Admin</span></div>
    </div>
    <nav class="nav" id="nav">
      <span class="nav-pill" id="navPill"></span>
      <button data-view="results"><svg viewBox="0 0 20 20"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>Results</button>
      <button data-view="plan"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="3"/><path d="M3 8.5h14M7 2.5v3M13 2.5v3M6.5 11.5h3M6.5 14h6"/></svg>Plan</button>
      <button data-view="places"><svg viewBox="0 0 20 20"><path d="M10 17s5.5-5 5.5-9a5.5 5.5 0 0 0-11 0c0 4 5.5 9 5.5 9z"/><circle cx="10" cy="8" r="2"/></svg>Places</button>
      <button data-view="friends"><svg viewBox="0 0 20 20"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.5" r="2.2"/><path d="M14 11.6c1.9 0 3.2 1.2 3.6 3.4"/></svg>Friends</button>
      <button data-view="settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>Settings</button>
    </nav>
    <div class="live" id="live"><span class="live-dot"></span><span id="liveText">Connecting…</span></div>
    <button class="share pressable" id="shareBtn">
      <span>Friends' link</span>
      <b id="shareUrl"></b>
      <small>Click to copy</small>
    </button>
  </aside>
  <main class="content" id="content"></main>
  <script src="/site/vendor/supabase.js"></script>
  <script src="/api/admin-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
